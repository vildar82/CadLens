name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CadLens.slnx

      - name: Build
        run: dotnet build CadLens.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CadLens.slnx --configuration Release --no-build --no-restore

      - name: Package AutoCAD bundle
        shell: pwsh
        run: ./scripts/New-Bundle.ps1

      - name: Upload AutoCAD bundle
        uses: actions/upload-artifact@v7
        with:
          name: CadLens.bundle
          path: artifacts/bundle/CadLens.bundle.zip
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: cadlens-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/AutoCAD/CadLens.AutoCAD/CadLens.AutoCAD.csproj -getProperty:Version -property:Configuration=Release

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read the plugin version.'
          }

          $tag = "v$version"
          gh release view $tag --json tagName > $null 2> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            "create=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$tag"

          if ($LASTEXITCODE -ne 0 -or $existingTag) {
            throw "Could not create release: tag $tag already exists or could not be checked."
          }

          "create=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Download AutoCAD bundle
        if: steps.version.outputs.create == 'true'
        uses: actions/download-artifact@v7
        with:
          name: CadLens.bundle
          path: artifacts/bundle

      - name: Publish release
        if: steps.version.outputs.create == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG artifacts/bundle/CadLens.bundle.zip --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish release $env:RELEASE_TAG."
          }
