name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CadLens.slnx

      - name: Build
        run: dotnet build CadLens.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CadLens.slnx --configuration Release --no-build --no-restore

      - name: Package AutoCAD bundle
        shell: pwsh
        run: ./scripts/New-Bundle.ps1

      - name: Upload AutoCAD bundle
        uses: actions/upload-artifact@v7
        with:
          name: CadLens.bundle
          path: artifacts/bundle/CadLens.bundle.zip
          archive: false
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download AutoCAD bundle
        uses: actions/download-artifact@v7
        with:
          name: CadLens.bundle
          path: artifacts/bundle

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = dotnet msbuild src/AutoCAD/CadLens.AutoCAD/CadLens.AutoCAD.csproj -getProperty:Version -property:Configuration=Release

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read the plugin version.'
          }

          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"

          if ($LASTEXITCODE -ne 0 -or $existingTag) {
            throw "Could not create release: tag $tag already exists or could not be checked."
          }

          gh release create $tag artifacts/bundle/CadLens.bundle.zip --target $env:GITHUB_SHA --title $tag --generate-notes --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish release $tag."
          }
